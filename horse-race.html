<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☕ 커피 내기 경마</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a1b;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1d1d1f; }
  canvas { display: block; }
  .hidden { display: none !important; }

  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(720px, 94vw); max-height: 90vh; overflow: auto; z-index: 10;
    background: rgba(255,255,255,0.94); border-radius: 18px; padding: 24px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35); backdrop-filter: blur(8px); }
  .panel.wide { width: min(1000px, 96vw); }
  .setupGrid { display: grid; grid-template-columns: 1fr 260px; gap: 22px; align-items: start; }
  .preview { position: sticky; top: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 10px 14px;
    border-radius: 14px; background: linear-gradient(#cfe9f7, #e8f4e2); }
  #pv { width: 240px; height: 260px; display: block; }
  #pvName { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  #pvName i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  #pvOwner { font-size: 14px; color: #4a5a4a; margin-top: 2px; min-height: 18px; }
  .panel h1 { margin: 0 0 4px; font-size: 26px; }
  .panel .sub { margin: 0 0 18px; color: #555; font-size: 14px; }

  .inputRow { display: flex; gap: 8px; }
  .inputRow input { flex: 1; font-size: 16px; padding: 10px 12px; border: 2px solid #ddd; border-radius: 10px; outline: none; }
  .inputRow input:focus { border-color: #2f7d32; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .btn { padding: 10px 16px; background: #2f7d32; color: #fff; font-weight: 700; }
  .btn.ghost { background: #eef3ee; color: #2f5d31; }
  .btn:disabled { background: #bbb; cursor: not-allowed; }

  #pickList { margin: 16px 0 8px; display: flex; flex-direction: column; gap: 10px; }
  .row { border: 1px solid #e5e5e5; border-radius: 12px; padding: 10px 12px; background: #fafafa; }
  .pname { display: flex; align-items: center; justify-content: space-between; font-weight: 800; margin-bottom: 8px; }
  .pname .x { background: transparent; color: #999; font-size: 20px; padding: 0 6px; }
  .horses { display: flex; flex-wrap: wrap; gap: 6px; }
  .hbtn { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #fff; border: 2px solid #e2e2e2; font-size: 14px; }
  .hbtn i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); display: inline-block; }
  .hbtn.sel { border-color: #2f7d32; background: #e8f5e9; font-weight: 800; }
  .hbtn:disabled { opacity: 0.3; cursor: not-allowed; }
  .footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  #hint { color: #666; font-size: 14px; }

  #hud { position: fixed; top: 14px; left: 14px; z-index: 5; background: rgba(0,0,0,0.55); color: #fff;
    border-radius: 12px; padding: 10px 12px; min-width: 180px; font-size: 14px; }
  #hud h3 { margin: 0 0 6px; font-size: 13px; opacity: 0.8; font-weight: 600; }
  #hud .r { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  #hud .r b { width: 18px; text-align: right; }
  #hud .r i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #hud .r.done { opacity: 0.75; }

  #countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 6;
    pointer-events: none; font-size: 140px; font-weight: 900; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,0.5); }
  #countdown.pop { animation: pop 0.8s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(2); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.8); opacity: 0; } }

  #banner { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 6; pointer-events: none;
    background: rgba(0,0,0,0.6); color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 22px; font-weight: 800;
    opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #banner.show { opacity: 1; }
  #muteBtn { position: fixed; top: 10px; right: 10px; z-index: 12; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 20px; line-height: 42px; padding: 0; }
  #flash { position: fixed; inset: 0; background: #fff; z-index: 7; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
  #flash.on { opacity: 1; transition: none; }

  #result table { width: 100%; border-collapse: collapse; margin: 12px 0 6px; font-size: 16px; }
  #result th, #result td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
  #result th { color: #777; font-size: 13px; font-weight: 600; }
  #result td.rk { font-weight: 900; width: 54px; }
  #result .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  /* ── 모바일: 기본 규칙을 덮어써야 하므로 반드시 맨 끝 ── */
  @media (max-width: 760px) {
    .setupGrid { grid-template-columns: 1fr; gap: 14px; }
    .preview { order: -1; position: static; flex-direction: row; gap: 10px; padding: 6px 12px; }
    #pv { width: 130px !important; height: 120px !important; }
    #pvName { font-size: 20px; }
  }
  @media (max-width: 600px) {
    .panel { padding: 16px 14px; border-radius: 14px; max-height: 94vh; }
    .panel h1 { font-size: 21px; }
    .panel .sub { font-size: 13px; margin-bottom: 12px; }
    .footer { flex-direction: column; align-items: stretch; }
    .footer > div { display: grid !important; grid-template-columns: 1fr 1fr; }
    .footer #startBtn { grid-column: 1 / -1; padding: 13px; font-size: 17px; }
    #hint { text-align: center; }
    #hud { top: 8px; left: 8px; padding: 6px 9px; min-width: 0; font-size: 12px; background: rgba(0,0,0,0.42); }
    #hud h3 { display: none; }
    #banner { top: auto; bottom: 26px; font-size: 17px; white-space: normal; text-align: center; width: max-content; max-width: 92vw; border-radius: 16px; }
    #countdown { font-size: 110px; }
    #result h1 { font-size: 20px; line-height: 1.35; }
    #result th, #result td { padding: 9px 4px; font-size: 15px; white-space: nowrap; }
    #result td.rk { width: 40px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="setup" class="panel wide">
 <div class="setupGrid">
 <div>
  <h1>☕ 커피 내기 경마</h1>
  <p class="sub">꼴찌로 들어오는 동물의 주인이 커피를 삽니다. 참가자를 입력하고 각자 동물을 고르세요.</p>
  <div class="inputRow">
    <input id="nameInput" placeholder="이름 (예: 민수, 영희, 민기)" maxlength="60" autocomplete="off">
    <button class="btn" id="addBtn">추가</button>
  </div>
  <div id="pickList"></div>
  <div class="footer">
    <span id="hint"></span>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" id="shareBtn">🔗 링크 복사</button>
      <button class="btn ghost" id="randBtn">동물 랜덤 배정</button>
      <button class="btn" id="startBtn" disabled>🏁 경주 시작</button>
    </div>
  </div>
 </div>
 <div class="preview">
  <canvas id="pv"></canvas>
  <div id="pvName"></div>
  <div id="pvOwner"></div>
 </div>
 </div>
</div>

<div id="hud" class="hidden"><h3>실시간 순위</h3><div id="hudList"></div></div>
<div id="countdown"></div>
<div id="banner"></div>
<div id="flash"></div>
<button id="muteBtn" title="소리 켜기/끄기">🔊</button>

<div id="result" class="panel hidden">
  <h1 id="resultTitle"></h1>
  <table><thead><tr><th>순위</th><th>참가자</th><th>동물</th><th>기록</th></tr></thead><tbody id="resultBody"></tbody></table>
  <div class="footer">
    <span></span>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" id="resetBtn">처음부터</button>
      <button class="btn" id="againBtn">같은 멤버로 다시</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

// ───────────────────────── 데이터 ─────────────────────────
const MAX_PLAYERS = 8;   // 레인 수
const PLAYER_COLORS = ['#e63946', '#1d4ed8', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
const players = []; // { name, animal: ANIMALS 인덱스 | null }

// 트랙: 두 직선(S) + 두 반원. 결승선 = 출발선 (아래쪽 직선 위 x = X_FIN), 1바퀴 경주.
const S = 56, R_IN = 22, LANE_W = 2.4, PAD = 1.5;
const R_OUT = R_IN + PAD * 2 + LANE_W * MAX_PLAYERS;
const X_FIN = S / 4;
const laneR = i => R_IN + PAD + LANE_W * (i + 0.5);
const lapLen = r => 2 * S + 2 * Math.PI * r;

function trackPoint(d, r) {
  const P = lapLen(r);
  let s = ((d + X_FIN + S / 2) % P + P) % P;
  if (s < S) return [-S / 2 + s, r];
  s -= S;
  if (s < Math.PI * r) { const th = s / r; return [S / 2 + r * Math.sin(th), r * Math.cos(th)]; }
  s -= Math.PI * r;
  if (s < S) return [S / 2 - s, -r];
  s -= S;
  const th = s / r; return [-S / 2 - r * Math.sin(th), -r * Math.cos(th)];
}

// ───────────────────────── 경주 계획 (시작 시점에 결과 확정) ─────────────────────────
// 진행률 f(u) = u + Σ a_k (sin(2πk·u + φ_k) − sin φ_k) / (2πk),  u = warp(t)/warp(T)
// f(0)=0, f(1)=1 이고 Σ|a_k| < 1 이라 항상 앞으로만 달린다. 결승 도착 시각은 정확히 T.
const TAU = 0.5;                      // 출발 가속 시간 상수
const warp = t => t - TAU * (1 - Math.exp(-t / TAU));
const AMPS = [0.26, 0.2, 0.14];

function makeProfile(T) {
  return { T, W: warp(T), terms: AMPS.map((m, i) => ({ k: i + 1, a: (Math.random() * 2 - 1) * m, phi: Math.random() * Math.PI * 2 })) };
}
function frac(p, t) {
  const u = warp(Math.max(0, t)) / p.W;
  let f = u;
  for (const { k, a, phi } of p.terms) f += a * (Math.sin(2 * Math.PI * k * u + phi) - Math.sin(phi)) / (2 * Math.PI * k);
  return f;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function planRace(n) {
  const order = shuffle([...Array(n).keys()]);   // order[등수] = 주자 인덱스
  const T = new Array(n);
  let t = 6 + Math.random() * 0.8;
  order.forEach((ri, rank) => { if (rank > 0) t += 0.08 + Math.random() * (rank === n - 1 ? 0.12 : 0.2); T[ri] = t; });

  // 막판까지 승부를 모르게: 85% 지점에서 꼴찌와 그 앞 말이 붙어 있고, 중반엔 꼴찌가 꼴찌가 아니도록
  const loser = order[n - 1], prev = order[n - 2], Tmin = T[order[0]];
  let profs;
  for (let tries = 0; tries < 500; tries++) {
    profs = T.map(makeProfile);
    const f85 = profs.map(p => frac(p, 0.85 * Tmin));
    if (Math.abs(f85[loser] - f85[prev]) > 0.025) continue;
    if (n >= 3) { const f60 = profs.map(p => frac(p, 0.6 * Tmin)); if (f60[loser] === Math.min(...f60)) continue; }
    break;
  }
  return { order, T, profs };
}

// ───────────────────────── Three.js 장면 ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3f0);
scene.fog = new THREE.Fog(0x9fd3f0, 220, 520);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 1200);
const camLook = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(60, 130, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 120, bottom: -120, near: 1, far: 400 });
sun.shadow.bias = -0.0005;
scene.add(sun);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function stadiumShape(r, ShapeClass = THREE.Shape) {
  const s = new ShapeClass();
  s.moveTo(-S / 2, -r); s.lineTo(S / 2, -r);
  s.absarc(S / 2, 0, r, -Math.PI / 2, Math.PI / 2, false);
  s.lineTo(-S / 2, r);
  s.absarc(-S / 2, 0, r, Math.PI / 2, Math.PI * 1.5, false);
  return s;
}
function flat(geo, mat, y) { const m = new THREE.Mesh(geo, mat); m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true; scene.add(m); return m; }

// 잔디, 내야, 주로
flat(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: 0x4f8a3c, roughness: 1 }), 0);
flat(new THREE.ShapeGeometry(stadiumShape(R_IN), 64), new THREE.MeshStandardMaterial({ color: 0x63a64b, roughness: 1 }), 0.02);
{
  const sh = stadiumShape(R_OUT); sh.holes.push(stadiumShape(R_IN, THREE.Path));
  flat(new THREE.ShapeGeometry(sh, 96), new THREE.MeshStandardMaterial({ color: 0xc49a6c, roughness: 1 }), 0.03);
}
// 레인 선
{
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
  for (let i = 0; i <= MAX_PLAYERS; i++) {
    const r = R_IN + PAD + LANE_W * i, P = lapLen(r), pts = [];
    for (let d = 0; d < P; d += 1.5) { const [x, z] = trackPoint(d, r); pts.push(new THREE.Vector3(x, 0.05, z)); }
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat));
  }
}
// 난간
{
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  const postGeo = new THREE.CylinderGeometry(0.09, 0.09, 1.1, 6);
  for (const r of [R_IN + 0.2, R_OUT - 0.2]) {
    const P = lapLen(r), pts = [];
    for (let d = 0; d < P; d += 2) { const [x, z] = trackPoint(d, r); pts.push(new THREE.Vector3(x, 1.1, z)); }
    const rail = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 400, 0.12, 6, true), white);
    rail.castShadow = true; scene.add(rail);
    const count = Math.floor(P / 4), posts = new THREE.InstancedMesh(postGeo, white, count), m = new THREE.Matrix4();
    for (let i = 0; i < count; i++) { const [x, z] = trackPoint(i * 4, r); m.makeTranslation(x, 0.55, z); posts.setMatrixAt(i, m); }
    posts.castShadow = true; scene.add(posts);
  }
}
// 결승선 + 아치
{
  const cells = 24;
  const tex = canvasTex(32, 16 * cells, (x) => {
    for (let j = 0; j < cells; j++) for (let i = 0; i < 2; i++) { x.fillStyle = (i + j) % 2 ? '#111' : '#fff'; x.fillRect(i * 16, j * 16, 16, 16); }
  });
  tex.magFilter = THREE.NearestFilter;
  const line = flat(new THREE.PlaneGeometry(1.6, R_OUT - R_IN), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }), 0.06);
  line.position.set(X_FIN, 0.06, (R_IN + R_OUT) / 2);

  const red = new THREE.MeshStandardMaterial({ color: 0xd32f2f });
  for (const z of [R_IN - 0.7, R_OUT + 0.7]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 8, 10), red);
    pole.position.set(X_FIN, 4, z); pole.castShadow = true; scene.add(pole);
  }
  const len = R_OUT - R_IN + 1.4;
  const txt = canvasTex(1024, 72, (x, w, h) => {
    x.fillStyle = '#d32f2f'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#fff'; x.font = 'bold 52px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('🏁  FINISH  🏁', w / 2, h / 2 + 2);
  });
  const tm = new THREE.MeshStandardMaterial({ map: txt });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.6, len), [tm, tm, red, red, red, red]);
  bar.position.set(X_FIN, 8, (R_IN + R_OUT) / 2); bar.castShadow = true; scene.add(bar);
}
// 관중석
{
  const zs = R_OUT + 8, mat = new THREE.MeshStandardMaterial({ color: 0xb0b6bf, roughness: 0.8 });
  for (let i = 0; i < 5; i++) {
    const step = new THREE.Mesh(new THREE.BoxGeometry(110, 1 + i * 1.2, 2.6), mat);
    step.position.set(0, (1 + i * 1.2) / 2, zs + i * 2.6); step.castShadow = step.receiveShadow = true; scene.add(step);
  }
  const roof = new THREE.Mesh(new THREE.BoxGeometry(114, 0.5, 15), new THREE.MeshStandardMaterial({ color: 0x1f4e79 }));
  roof.position.set(0, 11, zs + 5); roof.castShadow = true; scene.add(roof);
  const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(0.7, 1.1, 0.6), new THREE.MeshStandardMaterial(), 420);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  for (let k = 0; k < 420; k++) {
    const i = k % 5;
    m.makeTranslation(-53 + Math.random() * 106, 1 + i * 1.2 + 0.55, zs + i * 2.6 + (Math.random() - 0.5));
    crowd.setMatrixAt(k, m); crowd.setColorAt(k, c.setHSL(Math.random(), 0.6, 0.55));
  }
  crowd.castShadow = true; scene.add(crowd);
}
// 나무
{
  const N = 140, trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.4, 0.5, 3, 6), new THREE.MeshStandardMaterial({ color: 0x6d4c2f }), N);
  const crowns = new THREE.InstancedMesh(new THREE.ConeGeometry(2.6, 6, 8), new THREE.MeshStandardMaterial({ color: 0x2e6b30, roughness: 1 }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3();
  let placed = 0;
  while (placed < N) {
    const x = (Math.random() - 0.5) * 400, z = (Math.random() - 0.5) * 300;
    const dist = Math.hypot(Math.max(Math.abs(x) - S / 2, 0), z);
    if (dist < R_OUT + 10) continue;
    if (z > R_OUT && z < R_OUT + 32 && Math.abs(x) < 66) continue;
    const s = 0.8 + Math.random() * 0.7;
    sc.set(s, s, s);
    trunks.setMatrixAt(placed, m.compose(v.set(x, 1.5 * s, z), q, sc));
    crowns.setMatrixAt(placed, m.compose(v.set(x, 5.5 * s, z), q, sc));
    placed++;
  }
  trunks.castShadow = crowns.castShadow = true; scene.add(trunks, crowns);
}

// ───────────────────────── 동물 모델 ─────────────────────────
// 모든 동물은 +x 방향을 보고, build()는 { root, height, animate(phase, a) }를 돌려준다. a = 달리기 세기 0..1
// 단위 도형(G)을 공유하고 크기·회전으로 모양을 만든다. 공유 도형은 dispose하지 않는다.
const G = {
  sph: new THREE.SphereGeometry(1, 18, 14),
  box: new THREE.BoxGeometry(1, 1, 1),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 12),
  cone: new THREE.ConeGeometry(1, 1, 12),
};
Object.values(G).forEach(g => { g.userData.shared = true; });
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, ...o });
const PI = Math.PI;

function part(parent, geo, mat, p, s = [1, 1, 1], r = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...p); m.scale.set(...s); m.rotation.set(...r);
  parent.add(m); return m;
}
function group(parent, p) { const g = new THREE.Group(); g.position.set(...p); parent.add(g); return g; }
function base() { const root = new THREE.Group(), rig = group(root, [0, 0, 0]); return { root, rig }; }
function eyes(parent, x, y, z, s = 0.06, c = '#151515') {
  const m = M(c, { roughness: 0.3 });
  for (const zz of [z, -z]) part(parent, G.sph, m, [x, y, zz], [s, s, s]);
}
function legs4(rig, { fx, bx, z, hipF, hipB = hipF, r, mat, hoof }) {
  return [[fx, z, 0, hipF], [fx, -z, 0.5, hipF], [bx, z, PI, hipB], [bx, -z, PI + 0.5, hipB]].map(([x, zz, off, hip]) => {
    const pivot = group(rig, [x, hip, zz]);
    part(pivot, G.cyl, mat, [0, -hip / 2, 0], [r, hip, r]);
    if (hoof) part(pivot, G.box, hoof, [0, -hip + 0.06, 0], [r * 2.2, 0.12, r * 2.2]);
    return { pivot, off };

const gallop = (rig, legs, swing = 0.6, bob = 0.18) => (ph, a) => {
  for (const { pivot, off } of legs) pivot.rotation.z = Math.sin(ph + off) * swing * a;
  rig.position.y = Math.abs(Math.sin(ph)) * bob * a;
  rig.rotation.z = Math.sin(ph) * 0.04 * a;
};
// 몸통을 따라 고리 무늬 (구의 극축을 x로 눕혀서 쓰면 가로 줄무늬가 몸을 감는다)
function stripeMat(baseC, stripeC, n) {
  return M('#ffffff', { map: canvasTex(64, 256, (x, w, h) => {
    x.fillStyle = baseC; x.fillRect(0, 0, w, h); x.fillStyle = stripeC;
    for (let i = 1; i <= n; i++) {
      const y = (i / (n + 1)) * h; x.beginPath(); x.moveTo(0, y - 5);
      for (let u = 0; u <= w; u += 8) x.lineTo(u, y - 5 + Math.sin(u * 0.2 + i) * 4);
      for (let u = w; u >= 0; u -= 8) x.lineTo(u, y + 5 + Math.sin(u * 0.15 + i) * 4);
      x.fill();
    }
  }) });
}
function spotMat(baseC, spotC) {
  return M('#ffffff', { map: canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = baseC; x.fillRect(0, 0, w, h); x.fillStyle = spotC;
    for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
      x.beginPath(); x.roundRect(i * 32 + 3 + (j % 2) * 8, j * 32 + 3, 24 + Math.random() * 4, 24 + Math.random() * 4, 7); x.fill();
    }
  }) });
}

function automate(param, pts, t0, dur, mul, droop = 0) {

function voice(v, o) {

// ───────────────────────── 게임 상태 ─────────────────────────
// phase: setup → countdown → race → finish(결승 카메라) → result
let phase = 'setup', runners = [], raceT = 0, timeScale = 1, finishCamT = 0, finishedCount = 0, resultTimer = 0, finishCamZ = 0, finishCamSpan = 0;
const K_STOP = 8;

function runnerDist(rn, t) {
  if (t <= 0) return 0;
  if (t < rn.T) return frac(rn.prof, t) * rn.L;
  return rn.L + rn.vEnd * (1 - Math.exp(-(t - rn.T) * K_STOP)) / K_STOP;
}

function buildRace() {
  clearRunners();
  const n = players.length, plan = planRace(n), laneOff = Math.floor((MAX_PLAYERS - n) / 2);
  runners = players.map((p, i) => {
    const animal = ANIMALS[p.animal], color = PLAYER_COLORS[i], model = makeAnimal(p.animal);
    const r = laneR(i + laneOff), L = lapLen(r), prof = plan.profs[i], T = plan.T[i];
    const label = makeLabel(p.name, color); label.position.y = model.height + 0.9 + (i % 2) * 0.9; model.root.add(label);
    // 발밑의 참가자 색 고리: 위에서 볼 때 누가 누군지 구분
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.25, 1.5, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }));
    ring.rotation.x = -PI / 2; ring.position.y = 0.08; ring.scale.set(1.25, 0.8, 1); model.root.add(ring);
    scene.add(model.root);
    const vEnd = (frac(prof, T) - frac(prof, T - 0.01)) / 0.01 * L;
    return { player: p, animal, color, label, ...model, r, L, prof, T, vEnd, rank: plan.order.indexOf(i) + 1, nextCall: 0.3 + Math.random() * 1.8, finished: false, phase: Math.random() * 6, lastD: 0 };
  });
  const lanes = runners.map(rn => rn.r);
  finishCamZ = (Math.min(...lanes) + Math.max(...lanes)) / 2;
  finishCamSpan = Math.max(...lanes) - Math.min(...lanes) + LANE_W;
  sizeLabels();
  finishCamT = plan.T[plan.order[0]] - 0.6;   // 선두가 결승선에 닿기 직전 결승 카메라로 전환
  raceT = 0; timeScale = 1; finishedCount = 0;
  placeRunners(0);
}
function disposeTree(root) {
  root.parent?.remove(root);
  root.traverse(o => { if (!o.geometry?.userData.shared) o.geometry?.dispose(); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m?.map?.dispose(); m?.dispose(); }); });
}
function clearRunners() {
  runners.forEach(rn => disposeTree(rn.root));
  runners = [];
}

function placeRunners(dt) {
  for (const rn of runners) {
    const d = runnerDist(rn, raceT);
    const [x, z] = trackPoint(d, rn.r), [x2, z2] = trackPoint(d + 0.5, rn.r);
    rn.root.position.set(x, 0, z);
    rn.root.rotation.y = Math.atan2(-(z2 - z), x2 - x);
    const speed = dt > 0 ? (d - rn.lastD) / dt : 0;   // 화면상 속도 (슬로모션 반영)
    rn.lastD = d; rn.d = d;
    const amp = Math.min(0.75, speed * 0.06);
    rn.phase += speed * dt * 0.45;
    rn.animate(rn.phase, amp / 0.75);
  }
}

// ───────────────────────── 카메라 ─────────────────────────
const tmpPos = new THREE.Vector3(), tmpLook = new THREE.Vector3(), tmpUp = new THREE.Vector3(), camUp = new THREE.Vector3(0, 0, -1), scrR = new THREE.Vector3();
function updateCamera(dt, time) {
  if (phase === 'setup') {
    const a = time * 0.05;
    camera.position.set(Math.cos(a) * 140, 95, Math.sin(a) * 140);
    camLook.set(0, 0, 0);
  } else if (phase === 'countdown' || phase === 'race') {
    // 화면 위쪽이 가리킬 지면 방향 U: 가로 화면은 고정(−z), 세로 화면은 무리가 달리는 방향.
    // 세로 화면에서는 무리가 화면 긴 쪽으로 늘어서서 더 크게 보인다.
    if (camera.aspect < 1) {
      tmpUp.set(0, 0, 0);
      for (const rn of runners) { const a = rn.root.rotation.y; tmpUp.x += Math.cos(a); tmpUp.z -= Math.sin(a); }
      tmpUp.normalize();
    } else tmpUp.set(0, 0, -1);
    const k = phase === 'countdown' ? 1 : 1 - Math.exp(-dt * 4);
    camUp.lerp(tmpUp, k).normalize();
    scrR.set(-camUp.z, 0, camUp.x);
    // 화면 축 기준 경계 상자 → 모두 들어오는 최소 높이
    let r0 = Infinity, r1 = -Infinity, u0 = Infinity, u1 = -Infinity;
    for (const rn of runners) {
      const p = rn.root.position, r = p.x * scrR.x + p.z * scrR.z, u = p.x * camUp.x + p.z * camUp.z;
      r0 = Math.min(r0, r); r1 = Math.max(r1, r); u0 = Math.min(u0, u); u1 = Math.max(u1, u);
    }
    const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    // 세로 화면은 무리를 화면 아래쪽으로 내려서 왼쪽 위 순위표에 가리지 않게 한다
    const lift = camera.aspect < 1 ? 0.14 : 0;
    const h = THREE.MathUtils.clamp(Math.max(((r1 - r0) / 2 + 4) / (tanV * camera.aspect), ((u1 - u0) / 2 + 6) / tanV * (1 + lift * 2), 26), 26, 150);
    const mr = (r0 + r1) / 2, mu = (u0 + u1) / 2 + h * tanV * lift;
    tmpLook.set(scrR.x * mr + camUp.x * mu, 0, scrR.z * mr + camUp.z * mu);
    tmpPos.set(tmpLook.x - camUp.x * h * 0.38, h, tmpLook.z - camUp.z * h * 0.38);
    camera.position.lerp(tmpPos, k); camLook.lerp(tmpLook, k);
    camera.up.copy(camUp);
  } else {
    // 결승선 뒤에서 들어오는 동물들을 바라보는 시점. 화면이 좁으면 모든 레인이 들어오도록 더 뒤로 물러난다.
    const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.max(17, (finishCamSpan / 2 + 2.5) / (tanV * camera.aspect));
    const back = Math.min(4, (raceT - finishCamT) * 0.6);
    camera.position.set(X_FIN + dist + back, 4.2 + (dist - 17) * 0.12, finishCamZ + 3 * Math.min(1, camera.aspect));
    camLook.set(X_FIN - 22, 1.2, finishCamZ);
  }
  if (phase === 'setup' || phase === 'finish' || phase === 'result') camera.up.set(0, 1, 0);
  camera.lookAt(camLook);
}

// ───────────────────────── UI ─────────────────────────
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── 동물 미리보기 (설정 화면 오른쪽, 별도 렌더러로 회전) ──
const pvRenderer = new THREE.WebGLRenderer({ canvas: $('#pv'), antialias: true, alpha: true });
pvRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const pvScene = new THREE.Scene();
pvScene.add(new THREE.HemisphereLight(0xffffff, 0x6a8a5a, 1.3));
{ const l = new THREE.DirectionalLight(0xffffff, 1.6); l.position.set(3, 6, 4); pvScene.add(l); }
{ const g = new THREE.Mesh(new THREE.CircleGeometry(2.3, 40), new THREE.MeshStandardMaterial({ color: 0x63a64b })); g.rotation.x = -Math.PI / 2; pvScene.add(g); }
const pvCamera = new THREE.PerspectiveCamera(32, 240 / 260, 0.1, 50);
pvCamera.position.set(3.6, 2.6, 5.4); pvCamera.lookAt(0, 1.4, 0);
let pvModel = null, pvIndex = -1, pvPhase = 0, pvPinned = 0;   // pvPinned: 마지막으로 클릭한 동물

function setPreview(hi) {
  const h = ANIMALS[hi], owner = players.find(p => p.animal === hi)?.name;
  if (hi !== pvIndex) {
    const rot = pvModel ? pvModel.root.rotation.y : 0.6;
    if (pvModel) disposeTree(pvModel.root);
    pvModel = makeAnimal(hi); pvModel.root.rotation.y = rot; pvIndex = hi;
    pvScene.add(pvModel.root);
    const s = Math.max(pvModel.height, 2.6) / 2.6;   // 기린처럼 큰 동물은 카메라를 뒤로
    pvCamera.position.set(3.4 * s, 1.0 + 1.5 * s, 5.2 * s); pvCamera.lookAt(0, pvModel.height * 0.45, 0);
  }
  $('#pvName').innerHTML = `<i style="background:${h.coat}"></i>${h.name}`;
  $('#pvOwner').textContent = owner ? `${owner}의 동물` : '동물을 골라보세요';
}
function renderPreview(dt) {
  const w = $('#pv').clientWidth, hgt = $('#pv').clientHeight;
  if (!w || !pvModel) return;
  if (pvRenderer.domElement.width !== Math.round(w * pvRenderer.getPixelRatio())) {
    pvRenderer.setSize(w, hgt, false); pvCamera.aspect = w / hgt; pvCamera.updateProjectionMatrix();
  }
  pvModel.root.rotation.y += dt * 0.7;
  pvPhase += dt * 7;
  pvModel.animate(pvPhase, 0.7);
  pvRenderer.render(pvScene, pvCamera);
}

function addFromInput() {
  $('#nameInput').value.split(',').map(s => s.replace(/:/g, '').trim()).filter(Boolean).forEach(name => {
    if (players.length >= MAX_PLAYERS || players.some(p => p.name === name)) return;
    players.push({ name, animal: null });
  });
  $('#nameInput').value = '';
  renderSetup();
}
function renderSetup() {
  const list = $('#pickList'); list.innerHTML = '';
  players.forEach((p, pi) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="pname"><span>${esc(p.name)}</span><button class="x" title="삭제">×</button></div><div class="horses"></div>`;
    const hs = row.querySelector('.horses');
    ANIMALS.forEach((h, hi) => {
      const b = document.createElement('button');
      b.className = 'hbtn' + (p.animal === hi ? ' sel' : '');
      b.disabled = players.some((q, qi) => qi !== pi && q.animal === hi);
      b.innerHTML = `<i style="background:${h.coat}"></i>${h.name}`;
      b.onclick = () => {
        p.animal = p.animal === hi ? null : hi;
        if (p.animal === hi) playCall(h.name, { vol: 0.8 });
        pvPinned = hi;
        renderSetup();
      };
      b.onmouseenter = () => setPreview(hi);
      b.onmouseleave = () => setPreview(pvPinned);
      hs.appendChild(b);
    });
    row.querySelector('.x').onclick = () => { players.splice(pi, 1); renderSetup(); };
    list.appendChild(row);
  });
  const ready = players.length >= 2 && players.every(p => p.animal !== null);
  $('#randBtn').textContent = players.length && players.every(p => p.animal !== null) ? '🎲 다시 랜덤 배정' : '🎲 랜덤 배정';
  $('#startBtn').disabled = !ready;
  setPreview(pvPinned);
  $('#hint').textContent = players.length < 2 ? `참가자를 2명 이상 입력하세요 (최대 ${MAX_PLAYERS}명)` : ready ? '준비 완료!' : '각 참가자의 동물을 골라주세요';
  syncUrl();
}

// ── 참가자 목록 ↔ 주소창 (?p=순상:고양이,철수:호랑이,민기) ──
// 설정이 바뀔 때마다 주소를 갱신하므로, 그 링크를 공유하거나 북마크하면 같은 멤버로 바로 시작할 수 있다.
function syncUrl() {
  const url = new URL(location.href);
  const q = players.map(p => p.animal === null ? p.name : `${p.name}:${ANIMALS[p.animal].name}`).join(',');
  if (q) url.searchParams.set('p', q); else url.searchParams.delete('p');
  try { history.replaceState(null, '', url); } catch { /* 일부 브라우저는 file:// 에서 주소 변경을 막는다 */ }
}
function loadFromUrl() {
  const q = new URLSearchParams(location.search).get('p');
  if (!q) return;
  for (const tok of q.split(',')) {
    const [rawName, animalName] = tok.split(':'), name = rawName.trim();
    if (!name || players.length >= MAX_PLAYERS || players.some(p => p.name === name)) continue;
    const ai = ANIMALS.findIndex(a => a.name === animalName?.trim());
    players.push({ name, animal: ai >= 0 && !players.some(p => p.animal === ai) ? ai : null });
  }
  const first = players.find(p => p.animal !== null);
  if (first) pvPinned = first.animal;
}
$('#shareBtn').onclick = async () => {
  syncUrl();
  try { await navigator.clipboard.writeText(location.href); $('#hint').textContent = '🔗 링크를 복사했어요'; }
  catch { prompt('이 링크를 복사하세요', location.href); }
};
$('#addBtn').onclick = addFromInput;
$('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) addFromInput(); });
// 아직 안 고른 사람이 있으면 그 사람만 채우고(직접 고른 건 유지), 모두 정해졌으면 전원을 새로 섞는다
$('#randBtn').onclick = () => {
  const allSet = players.length > 0 && players.every(p => p.animal !== null);
  if (allSet) players.forEach(p => { p.animal = null; });
  const free = shuffle(ANIMALS.map((_, i) => i).filter(i => !players.some(p => p.animal === i)));
  players.forEach(p => { if (p.animal === null) pvPinned = p.animal = free.pop(); });
  renderSetup();
};
$('#startBtn').onclick = startRace;
$('#againBtn').onclick = () => toSetup(false);
$('#resetBtn').onclick = () => toSetup(true);

function banner(text) { const b = $('#banner'); b.textContent = text; b.classList.add('show'); }
function toSetup(clear) {
  clearRunners(); clearTimeout(resultTimer);
  if (clear) players.length = 0;
  phase = 'setup';
  ['#result', '#hud'].forEach(s => $(s).classList.add('hidden'));
  $('#banner').classList.remove('show');
  $('#setup').classList.remove('hidden');
  renderSetup();
}

async function startRace() {
  $('#setup').classList.add('hidden');
  audioCtx();   // 시작 버튼 클릭 안에서 소리 허용
  buildRace();
  phase = 'countdown';
  $('#hud').classList.remove('hidden'); updateHud();
  const cd = $('#countdown');
  for (const s of ['3', '2', '1', 'GO!']) {
    cd.textContent = s; cd.classList.remove('pop'); void cd.offsetWidth; cd.classList.add('pop');
    beep(s === 'GO!' ? 880 : 440);
    await sleep(500);
    if (phase !== 'countdown') return;
  }
  phase = 'race';
}

function updateHud() {
  const sorted = [...runners].sort((a, b) => (a.finished && b.finished) ? a.rank - b.rank : (b.d / b.L) - (a.d / a.L));
  $('#hudList').innerHTML = sorted.map((rn, i) =>
    `<div class="r${rn.finished ? ' done' : ''}"><b>${i + 1}</b><i style="background:${rn.color}"></i>${esc(rn.player.name)} <small style="opacity:.7">${rn.animal.name}</small>${rn.finished ? ' 🏁' : ''}</div>`).join('');
}

function showResult() {
  phase = 'result';
  const sorted = [...runners].sort((a, b) => a.rank - b.rank);
  $('#resultTitle').textContent = '🏁 경주 결과';
  $('#resultBody').innerHTML = sorted.map((rn, i) => {
    const medal = ['🥇', '🥈', '🥉'][i] ?? `${i + 1}위`;
    return `<tr><td class="rk">${medal}</td><td>${esc(rn.player.name)}</td>
      <td><span class="dot" style="background:${rn.color}"></span>${rn.animal.name}</td><td>${rn.T.toFixed(2)}초</td></tr>`;
  }).join('');
  $('#result').classList.remove('hidden');
}

// ───────────────────────── 루프 ─────────────────────────
const clock = new THREE.Clock();
let hudAcc = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  if (phase === 'race' || phase === 'finish' || phase === 'result') {
    const rdt = dt * timeScale;
    raceT += rdt;
    if (phase === 'race' && raceT >= finishCamT) {
      phase = 'finish'; timeScale = 0.7;
      const f = $('#flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
    }
    for (const rn of runners) {
      if (rn.finished || raceT < rn.T) continue;
      rn.finished = true; finishedCount++;
      if (finishedCount === 1) banner(`🏁 1위 골인! ${rn.player.name} (${rn.animal.name})`);
      if (finishedCount === runners.length) {
        banner('🏁 경주 종료!');
        playLoserCry(rn.animal.name);   // 마지막으로 들어온 동물이 운다
        timeScale = 1;
        resultTimer = setTimeout(showResult, 2200);
      }
    }
    placeRunners(rdt);
    // 달리는 동안 각자 가끔 운다. 화면 왼쪽/오른쪽 위치에 맞춰 스테레오로 들린다.
    for (const rn of runners) {
      if (rn.finished || raceT < rn.nextCall) continue;
      rn.nextCall = raceT + 2.2 + Math.random() * 2.8;
      const x = tmpPos.copy(rn.root.position).project(camera).x;
      playCall(rn.animal.name, { vol: 0.45, pan: THREE.MathUtils.clamp(x, -1, 1) * 0.8 });
    }
    if ((hudAcc += dt) > 0.15) { hudAcc = 0; updateHud(); }
  }
  if (phase === 'setup') renderPreview(dt);
  updateCamera(dt, time);
  renderer.render(scene, camera);
});

function fitView() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 64 : 50;   // 세로 화면은 시야를 넓혀 레인이 잘리지 않게
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizeLabels();
}
addEventListener('resize', fitView);
fitView();
loadFromUrl();
renderSetup();
setMuted(audio.muted);
$('#muteBtn').onclick = () => { audioCtx(); setMuted(!audio.muted); };
</script>
</body>
</html>
