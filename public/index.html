<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c6b2f4">
<title>☕ 커피 내기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="app.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body class="in-setup">

<div id="setup" class="screen">
  <!-- 1단계: 게임 고르기 -->
  <section id="step1" class="step">
    <header class="top">
      <h1 class="title spark">커피 내기 <span class="tcup" aria-hidden="true">☕</span></h1>
    </header>
    <div class="carousel">
      <button class="arrow prev tap" id="prevGame" aria-label="이전 게임">‹</button>
      <div id="gameCards" class="cards" role="listbox" aria-label="게임 고르기"></div>
      <button class="arrow next tap" id="nextGame" aria-label="다음 게임">›</button>
    </div>
    <div id="dots" class="dots"></div>
    <div class="bar">
      <button class="btn big yellow tap spark" id="nextBtn">다음</button>
    </div>
  </section>

  <!-- 2단계: 참가자 + 동물 고르기 -->
  <section id="step2" class="step hidden">
    <header class="top">
      <button class="iconBtn tap" id="backBtn" aria-label="게임 다시 고르기">‹</button>
      <h1 class="title spark">동물 고르기</h1>
      <button class="iconBtn tap" id="shareBtn" aria-label="링크 복사">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </header>
    <button class="gameTag tap" id="gameTag" aria-label="게임 바꾸기"></button>
    <div id="tabs" class="tabs" role="tablist" aria-label="참가자"></div>
    <form id="addForm" class="addForm hidden" autocomplete="off">
      <input id="nameInput" placeholder="이름 (쉼표로 여러 명)" maxlength="60" enterkeyhint="done" aria-label="참가자 이름">
      <button class="btn small yellow tap" id="addBtn" type="submit">추가</button>
      <button class="btn small white tap" id="addDone" type="button">완료</button>
    </form>
    <div class="paper">
      <div class="pvRow">
        <canvas id="pv"></canvas>
        <div class="pvText"><div id="pvName"></div><div id="pvOwner"></div></div>
      </div>
      <div id="animalGrid" class="agrid"></div>
    </div>
    <div class="bar">
      <p id="hint" aria-live="polite"></p>
      <div class="two">
        <button class="btn big white tap" id="randBtn">랜덤 배정</button>
        <button class="btn big yellow tap spark" id="startBtn" disabled>시작</button>
      </div>
    </div>
  </section>
</div>

<div id="hud" class="hidden"><h3 id="hudTitle" class="sticker"></h3><div id="hudList"></div></div>
<div id="countdown"></div>
<div id="banner"></div>
<div id="flash"></div>
<div id="toast" role="status"></div>
<button id="muteBtn" class="tap" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>

<div id="result" class="screen hidden">
  <div class="resultBody">
    <header class="top"><h1 class="title spark" id="resultTitle"></h1></header>
    <div class="hero" id="resultHero"></div>
    <ol class="ranks" id="resultList"></ol>
    <div class="bar">
      <button class="btn big yellow tap spark" id="againBtn">한 판 더</button>
      <button class="btn big white tap" id="changeBtn">게임 바꾸기</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
