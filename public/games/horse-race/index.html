<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☕ 커피 내기 경마</title>
<link rel="stylesheet" href="../../shared/base.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="setup" class="panel wide">
 <div class="setupGrid">
 <div>
  <h1>☕ 커피 내기 경마</h1>
  <p class="sub">꼴찌로 들어오는 동물의 주인이 커피를 삽니다. 참가자를 입력하고 각자 동물을 고르세요.</p>
  <div class="inputRow">
    <input id="nameInput" placeholder="이름 (예: 민수, 영희, 민기)" maxlength="60" autocomplete="off">
    <button class="btn" id="addBtn">추가</button>
  </div>
  <div id="pickList"></div>
  <div class="footer">
    <span id="hint"></span>
    <div>
      <button class="btn ghost" id="shareBtn">🔗 링크 복사</button>
      <button class="btn ghost" id="randBtn">동물 랜덤 배정</button>
      <button class="btn" id="startBtn" disabled>🏁 경주 시작</button>
    </div>
  </div>
 </div>
 <div class="preview">
  <canvas id="pv"></canvas>
  <div id="pvName"></div>
  <div id="pvOwner"></div>
 </div>
 </div>
</div>

<div id="hud" class="hidden"><h3>실시간 순위</h3><div id="hudList"></div></div>
<div id="countdown"></div>
<div id="banner"></div>
<div id="flash"></div>
<button id="muteBtn" title="소리 켜기/끄기">🔊</button>

<div id="result" class="panel hidden">
  <h1 id="resultTitle"></h1>
  <table><thead><tr><th>순위</th><th>참가자</th><th>동물</th><th>기록</th></tr></thead><tbody id="resultBody"></tbody></table>
  <div class="footer">
    <span></span>
    <div>
      <button class="btn ghost" id="resetBtn">처음부터</button>
      <button class="btn" id="againBtn">같은 멤버로 다시</button>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
