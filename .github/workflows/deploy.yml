# main에 올리면 테스트 후 public/ 폴더를 Cloudflare(coffee-race)에 배포한다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Actions 탭에서 "Run workflow"로 직접 실행할 수도 있다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 테스트
        run: npm test
      - name: Secrets 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::저장소 Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN 과 CLOUDFLARE_ACCOUNT_ID 를 넣어 주세요."
            exit 1
          fi
      - name: Cloudflare 배포
        run: npx --yes wrangler@4.168.0 deploy
